---

# TEMPORARY DEBUG MODE: resume from HP Dashmate setup

- name: Set up core and platform on HP masternodes
  hosts: hp_masternodes
  become: true
  gather_facts: false
  # Using strategy: free for parallel execution to improve deployment speed
  # This is intentional for performance optimization
  strategy: free  # noqa: run-once[play]
  serial: 0
  pre_tasks:
    - name: Check inventory for HP masternodes
      ansible.builtin.set_fact:
        node: "{{ hp_masternodes[inventory_hostname] }}"
      tags: always
      when: inventory_hostname in hp_masternodes
  roles:
    - role: dash_cli
      when: not skip_dashmate_image_update | default(false)
    - role: dashmate
    - role: mn_status_report
      when: not skip_dashmate_image_update | default(false)
    - role: metricbeat
      when: not skip_dashmate_image_update | default(false)
  tags:
    - full_deploy
    - dashmate_deploy


- name: Set up protx diff script
  hosts: masternodes
  become: true
  roles:
    - role: mn_protx_diff
  tags:
    - full_deploy
    - maintenance

- name: Set up fake latency on masternodes
  hosts: hp_masternodes,masternodes
  become: true
  roles:
    - role: add_fake_latency
      when: masternode_network_latency
    - role: remove_fake_latency
      when: not masternode_network_latency
  tags:
    - full_deploy
    - maintenance

- name: Generate dash.conf for configs repo
  hosts: localhost
  roles:
    - dash-conf
  tags:
    - full_deploy

- name: Clean up
  hosts: all
  become: true
  tasks:
    - name: Prune unused Docker images
      community.docker.docker_prune:
        containers: true
        images: true
        images_filters:
          dangling: false
        networks: true
        volumes: false
        builder_cache: true
  tags:
    - full_deploy
    - cleanup
