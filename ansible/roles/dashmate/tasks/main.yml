---

- name: Set vars
  ansible.builtin.import_tasks: ./set_vars.yml

# ============================================================================
# PHASE 1: Initial checks (always run)
# ============================================================================

- name: Check if dashmate config directory exists
  ansible.builtin.stat:
    path: '{{ dashmate_config_dir }}'
  register: dashmate_config_dir_stat

- name: Check if dashmate is installed
  ansible.builtin.command: which dashmate
  register: dashmate_installed
  failed_when: false
  changed_when: false

- name: Get current dashmate version if installed
  ansible.builtin.command: "{{ dashmate_cmd }} --version"
  become: true
  become_user: dashmate
  args:
    chdir: '{{ dashmate_cwd }}'
  register: current_dashmate_version
  when: dashmate_installed.rc == 0
  failed_when: false
  changed_when: false

- name: Extract installed version number
  ansible.builtin.set_fact:
    installed_dashmate_version: "{{ current_dashmate_version.stdout | regex_search('([0-9]+\\\\.[0-9]+\\\\.[0-9]+-[a-zA-Z]+\\\\.[0-9]+)') if current_dashmate_version.stdout is defined else 'none' }}"

- name: Compare versions
  ansible.builtin.set_fact:
    dashmate_needs_update: "{{ installed_dashmate_version != dashmate_version }}"

- name: Debug version comparison
  ansible.builtin.debug:
    msg: "Installed: {{ installed_dashmate_version }}, Required: {{ dashmate_version }}, Needs update: {{ dashmate_needs_update }}"

# ============================================================================
# PHASE 2: User and system setup (skip in fast mode)
# ============================================================================

- name: Check if dashmate group exists
  ansible.builtin.getent:
    database: group
    key: '{{ dashmate_group }}'
  register: dashmate_group_check
  failed_when: false

- name: Check if dashmate user exists
  ansible.builtin.getent:
    database: passwd
    key: '{{ dashmate_user }}'
  register: dashmate_user_check
  failed_when: false

- name: Create dashmate group
  ansible.builtin.group:
    name: '{{ dashmate_group }}'
  when: 
    - not skip_dashmate_image_update | default(false)
    - (dashmate_group_check.rc | default(0)) != 0

- name: Create dashmate user
  ansible.builtin.user:
    name: '{{ dashmate_user }}'
    comment: 'Dashmate user'
    group: '{{ dashmate_group }}'
    home: '{{ dashmate_home }}'
    create_home: true
    shell: /bin/bash
    umask: '0002'
  when: 
    - not skip_dashmate_image_update | default(false)
    - (dashmate_user_check.rc | default(0)) != 0

- name: Add dashmate user to docker group
  ansible.builtin.user:
    name: 'dashmate'
    groups: docker
    append: true
  when: 
    - not skip_dashmate_image_update | default(false)
    - (dashmate_user_check.rc | default(0)) != 0

# ============================================================================
# PHASE 3: Dash configuration (skip in fast mode)
# ============================================================================

- name: Check if dash.conf exists
  ansible.builtin.stat:
    path: /etc/dash.conf
  register: dash_conf_stat

- name: Generate dash.conf content
  ansible.builtin.set_fact:
    dash_conf_content: "{{ lookup('template', 'dash.conf.j2') }}"
  when: not skip_dashmate_image_update | default(false)

- name: Check existing dash.conf content
  ansible.builtin.slurp:
    src: /etc/dash.conf
  register: existing_dash_conf
  when: 
    - not skip_dashmate_image_update | default(false)
    - (dash_conf_stat.stat.exists | default(false))
  failed_when: false

- name: Write dash.conf for dash-cli
  ansible.builtin.template:
    src: dash.conf.j2
    dest: /etc/dash.conf
    owner: root
    group: root
    mode: "0644"
  when: 
    - not skip_dashmate_image_update | default(false)
    - not (dash_conf_stat.stat.exists | default(false)) or (existing_dash_conf.content | default('') | b64decode != dash_conf_content)
  register: dash_conf_changed

- name: Configure system users for dash-cli
  ansible.builtin.include_role:
    name: dash_cli
    tasks_from: configure_users
  vars:
    users: '{{ system_users }}'
  when: 
    - not skip_dashmate_image_update | default(false)
    - dash_conf_changed is defined
    - dash_conf_changed is changed

- name: Configure dashmate user for dash-cli
  ansible.builtin.include_role:
    name: dash_cli
    tasks_from: configure_users
  vars:
    dashmate_user_dict:
      user: '{{ dashmate_user }}'
      group: '{{ dashmate_group }}'
      dir: '{{ dashmate_home }}'
    users: 
      - "{{ dashmate_user_dict }}"
  when: 
    - not skip_dashmate_image_update | default(false)
    - dash_conf_changed is defined
    - dash_conf_changed is changed
    - (dashmate_user_check.rc | default(1)) == 0

# ============================================================================
# PHASE 4: Logging setup (skip in fast mode)
# ============================================================================

- name: Check if log configuration exists
  ansible.builtin.stat:
    path: /etc/logrotate.d/dashmate
  register: logrotate_config_stat

- name: Configure logs
  ansible.builtin.import_tasks: ./logs.yml
  when: 
    - not skip_dashmate_image_update | default(false)
    - not (logrotate_config_stat.stat.exists | default(false)) or force_logs_config | default(false)
    - (dashmate_user_check.rc | default(1)) == 0  # Only configure logs if user exists

# ============================================================================
# PHASE 5: Dashmate installation and configuration (always run)
# ============================================================================

- name: Create dashmate config dir
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: '{{ dashmate_user }}'
    group: '{{ dashmate_group }}'
    mode: '0755'
  loop:
    - '{{ dashmate_config_dir }}'
  when: 
    - not (dashmate_config_dir_stat.stat.exists | default(false))
    - (dashmate_user_check.rc | default(1)) == 0  # Only create if user exists

- name: Build dashmate
  ansible.builtin.import_tasks: ./build.yml
  when: 
    - dashmate_branch is defined
    - dashmate_installed.rc != 0 or force_dashmate_rebuild | default(false)

- name: Install dashmate
  ansible.builtin.import_tasks: ./install.yml
  when: 
    - dashmate_version is defined
    - (dashmate_needs_update | default(true)) or force_dashmate_reinstall | default(false)

- name: Retrieve dashmate version
  ansible.builtin.command: "{{ dashmate_cmd }} --version"
  become: true
  become_user: dashmate
  args:
    chdir: '{{ dashmate_cwd }}'
  register: dashmate_version_result
  changed_when: dashmate_version_result.rc == 0

- name: Extract dashmate version
  ansible.builtin.set_fact:
    dashmate_config_version: "{{ (dashmate_version_result.stdout | split(' ') | first() | split('/'))[1] }}"

# This check will return an error code if config is missing, config schema is invalid or default config is not yet set
- name: Check state of dashmate config
  ansible.builtin.command: "{{ dashmate_cmd }} config"
  become: true
  become_user: dashmate
  args:
    chdir: '{{ dashmate_cwd }}'
  register: dashmate_config_result
  ignore_errors: true
  changed_when: true

- name: Get ZeroSSL certificate ID from config
  ansible.builtin.command: "{{ dashmate_cmd }} config get platform.gateway.ssl.providerConfigs.zerossl.id"
  become: true
  become_user: dashmate
  args:
    chdir: '{{ dashmate_cwd }}'
  register: dashmate_zerossl_id_result
  changed_when: dashmate_zerossl_id_result.rc == 0
  when: dashmate_config_result.rc == 0

- name: Set ZeroSSL certificate ID from config
  ansible.builtin.set_fact:
    dashmate_zerossl_config_certificate_id: "{{ dashmate_zerossl_id_result.stdout }}"
  when: dashmate_config_result.rc == 0 and dashmate_zerossl_id_result is defined and dashmate_zerossl_id_result.stdout != 'null'

- name: Write dashmate config file
  vars:
    template_bootstrap_peers: "{{ groups.seed_nodes }}"
  ansible.builtin.template:
    src: dashmate.json.j2
    dest: '{{ dashmate_config_dir }}/config.json'
    owner: '{{ dashmate_user }}'
    group: '{{ dashmate_group }}'
    mode: "0644"
  register: template_result
  when: dashmate_user_check.rc == 0  # Only write if user exists

- name: Check if service configs need rendering
  ansible.builtin.stat:
    path: '{{ dashmate_home }}/.dashmate/docker-compose.yml'
  register: docker_compose_stat

- name: Render service configs
  ansible.builtin.command: "{{ dashmate_cmd }} config render"
  become: true
  become_user: dashmate
  args:
    chdir: '{{ dashmate_cwd }}'
  register: dashmate_render_configs_result
  changed_when: dashmate_render_configs_result.rc == 0
  when: not (docker_compose_stat.stat.exists | default(false)) or template_result.changed or force_config_render | default(false)

# ============================================================================
# PHASE 6: SSL certificates (skip in fast mode)
# ============================================================================

- name: Check if SSL certificates exist
  ansible.builtin.stat:
    path: '{{ dashmate_home }}/.dashmate/ssl/bundle.crt'
  register: ssl_cert_stat
  when: dashmate_platform_enable

- name: Generate self-signed SSL certificate for DAPI
  ansible.builtin.import_tasks: ./ssl/self_signed.yml
  when: 
    - dashmate_platform_enable 
    - dashmate_platform_gateway_ssl_provider == 'self-signed'
    - not (ssl_cert_stat.stat.exists | default(false)) or force_ssl_regenerate | default(false)
    - not skip_dashmate_image_update | default(false)

- name: Obtain ZeroSSL certificate for DAPI
  ansible.builtin.import_tasks: ./ssl/zerossl.yml
  when: 
    - dashmate_platform_enable 
    - dashmate_platform_gateway_ssl_provider == 'zerossl'
    - not (ssl_cert_stat.stat.exists | default(false)) or force_ssl_regenerate | default(false)
    - not skip_dashmate_image_update | default(false)

# ============================================================================
# PHASE 7: Environment and Docker images
# ============================================================================

- name: Check if .env file exists
  ansible.builtin.stat:
    path: '{{ dashmate_home }}/.env'
  register: env_file_stat

- name: Export current dashmate config
  ansible.builtin.shell: "{{ dashmate_cmd }} config envs > {{ dashmate_home }}/.env"
  become: true
  become_user: dashmate
  args:
    chdir: '{{ dashmate_cwd }}'
  register: dashmate_envs
  changed_when: dashmate_envs.rc == 0
  when: not (env_file_stat.stat.exists | default(false)) or template_result.changed or force_env_export | default(false)

- name: Check if images need update
  ansible.builtin.set_fact:
    skip_image_update: "{{ skip_dashmate_image_update | default(false) }}"

- name: Update dashmate images
  ansible.builtin.command: "{{ dashmate_cmd }} update --format=json"
  become: true
  become_user: dashmate
  register: dashmate_update
  args:
    chdir: '{{ dashmate_cwd }}'
  changed_when: dashmate_update.rc == 0
  when: not skip_image_update

# ============================================================================
# PHASE 8: Service management
# ============================================================================

- name: Get service statuses
  ansible.builtin.command: "{{ dashmate_cmd }} status services --format=json"
  become: true
  become_user: dashmate
  changed_when: dashmate_services_status.rc == 0
  args:
    chdir: '{{ dashmate_cwd }}'
  register: dashmate_services_status

- name: Set facts
  ansible.builtin.set_fact:
    is_core_started: >-
      {{
        dashmate_services_status.stdout |
        from_json |
        json_query('[?service==`core`&&status!=`not_started`]') |
        length | int > 0
      }}
    is_platform_started: >-
      {{
        dashmate_services_status.stdout |
        from_json |
        json_query('[?service!=`core`&&status!=`not_started`]') |
        length | int > 0
      }}
    is_core_images_updated: "{{ false if skip_dashmate_image_update | default(false) else (dashmate_update.stdout | default('[]') | from_json | json_query('[?name==`core`]') | sort(attribute='updated', reverse=true) | first(default={}) | json_query('updated') | default(false)) }}"
    is_platform_images_updated: "{{ false if skip_dashmate_image_update | default(false) else (dashmate_update.stdout | default('[]') | from_json | json_query('[?name!=`core`]') | sort(attribute='updated', reverse=true) | first(default={}) | json_query('updated') | default(false)) }}"
    is_dashmate_package_changed: "{{ dashmate_install_result.changed if dashmate_install_result is defined else false }}"
    is_dashmate_config_changed: "{{ template_result.changed if template_result is defined else false }}"

- name: Print status
  ansible.builtin.debug:
    msg: "\nCore Started: {{ is_core_started }}
          \nPlatform Started: {{ is_platform_started }}
          \nCore Images Updated: {{ is_core_images_updated }}
          \nPlatform Images Updated: {{ is_platform_images_updated }}
          \nDashmate Package Updated: {{ is_dashmate_package_changed }}
          \nDashmate Config Changed: {{ is_dashmate_config_changed }}"

# Start logic:
# start ALL when (core is down and platform is down)
# start platform when (core is up and platform is down)

# Start all if everything is stopped (not started yet)
- name: Start all dashmate services
  ansible.builtin.command: "{{ dashmate_cmd }} start --verbose"
  become: true
  become_user: dashmate
  args:
    chdir: '{{ dashmate_cwd }}'
  register: dashmate_start_all
  when:
    - not is_core_started
    - not is_platform_started
  changed_when: dashmate_start_all.rc == 0

# Restart logic
# dashmate version is changed => restart all
# dashmate config is changed => restart all

# Fast deployment: each node restarts itself independently
- name: Restart all dashmate services (fast mode - individual restart)
  ansible.builtin.command: "{{ dashmate_cmd }} restart --safe --verbose"
  become: true
  become_user: dashmate
  args:
    chdir: '{{ dashmate_cwd }}'
  register: dashmate_restart_all
  when:
    - not (dashmate_start_all.changed | default(false))
    - is_dashmate_package_changed or is_dashmate_config_changed
    - skip_dashmate_image_update | default(false)
  changed_when: dashmate_restart_all.rc == 0

# Regular deployment: coordinated chunked restarts
- name: Synchronization point - wait for all nodes to complete individual tasks
  ansible.builtin.meta: flush_handlers
  when:
    - not (dashmate_start_all.changed | default(false))
    - is_dashmate_package_changed or is_dashmate_config_changed
    - not (skip_dashmate_image_update | default(false))

- name: Force synchronization before coordinated restart
  ansible.builtin.debug:
    msg: "All nodes ready for coordinated restart"
  when:
    - not (dashmate_start_all.changed | default(false))
    - is_dashmate_package_changed or is_dashmate_config_changed
    - not (skip_dashmate_image_update | default(false))

- name: Create host chunks to restart
  ansible.builtin.set_fact:
    host_chunks: "{{ play_hosts | batch(restart_chunk_size) }}"
  when:
    - not (dashmate_start_all.changed | default(false))
    - is_dashmate_package_changed or is_dashmate_config_changed
    - not (skip_dashmate_image_update | default(false))
    - inventory_hostname == play_hosts[0]

- name: Print chunks info
  ansible.builtin.debug:
    msg: "Split {{ play_hosts | length }} into {{ host_chunks | default([]) | length }} chunks to restart all services"
  when:
    - not (dashmate_start_all.changed | default(false))
    - is_dashmate_package_changed or is_dashmate_config_changed
    - not (skip_dashmate_image_update | default(false))
    - inventory_hostname == play_hosts[0]

- name: Restart all dashmate services by chunks (regular mode)
  ansible.builtin.include_tasks: rolling_restart.yml
  loop: "{{ host_chunks | default([]) }}"
  loop_control:
    loop_var: current_chunk
    index_var: current_chunk_index
    label: "{{ current_chunk }}"
  when:
    - not (dashmate_start_all.changed | default(false))
    - is_dashmate_package_changed or is_dashmate_config_changed
    - not (skip_dashmate_image_update | default(false))
    - inventory_hostname == play_hosts[0]

# Force start logic
# Force start is equivalent to `docker compose up` and will replace services that have changed

- name: Start not started services and replace updated services
  ansible.builtin.command: "{{ dashmate_cmd }} start --force --verbose"
  become: true
  become_user: dashmate
  args:
    chdir: '{{ dashmate_cwd }}'
  register: dashmate_force_start
  when:
    - not (dashmate_start_all.changed | default(false))
    - not (dashmate_restart_all.changed | default(false))
    - not (is_dashmate_package_changed or is_dashmate_config_changed)
  changed_when: dashmate_force_start.rc == 0

- name: Disable dashmate helper build
  ansible.builtin.command: "{{ dashmate_cmd }} config set dashmate.helper.docker.build.enabled false"
  become: true
  become_user: dashmate
  register: build_dashmate_helper
  args:
    chdir: '{{ dashmate_cwd }}'
  changed_when: build_dashmate_helper.rc == 0