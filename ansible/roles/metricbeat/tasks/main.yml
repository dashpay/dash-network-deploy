---

- name: Require an intentional logging backend before configuring collection
  ansible.builtin.assert:
    that:
      - groups.get('logs_nodes', []) | length > 0
      - "'logs-1' in groups.get('logs_nodes', [])"
      - hostvars['logs-1'].private_ip is defined
    fail_msg: >-
      Metricbeat is enabled but the logging backend is absent from inventory.
      Establish its intended identity or explicitly retire the shipper while
      preserving backlog; never re-enable collection against a guessed endpoint.
  when: metricbeat_enabled | bool

- name: Detect actual architecture
  ansible.builtin.command: uname -m
  register: detected_architecture
  changed_when: false

- name: Set architecture fact based on detection
  ansible.builtin.set_fact:
    detected_arch: >-
      {{
        'x86_64' if detected_architecture.stdout in ['x86_64', 'amd64']
        else 'aarch64' if detected_architecture.stdout in ['aarch64', 'arm64']
        else detected_architecture.stdout
      }}

- name: Set facts for metricbeat role (assume Ubuntu/Debian)
  ansible.builtin.set_fact:
    ansible_os_family: "Debian"
    ansible_distribution: "Ubuntu"
    ansible_distribution_major_version: "22"
    ansible_distribution_release: "jammy"
    ansible_pkg_mgr: "apt"
    ansible_architecture: "{{ detected_arch }}"

- name: Set up metricbeat
  ansible.builtin.include_role:
    name: elastic.beats
  vars:
    beats_version: "{{ elastic_version }}"
    beat: metricbeat
    beat_conf:
      setup:
        dashboards:
          # Dashboard loading is optional one-shot provisioning, never a
          # prerequisite for collection. See setup_dashboards.yml.
          enabled: false
        kibana:
          host: "{{ hostvars['logs-1'].private_ip }}:5601"
          username: "{{ elastic_username }}"
          password: "{{ elastic_password }}"
      metricbeat:
        modules:
          - module: system
            metricsets:
              - cpu             # CPU usage
              - load            # CPU load averages
              - memory          # Memory usage
              - network         # Network IO
              - process         # Per process metrics
              - process_summary # Process summary
              - uptime          # System Uptime
              - socket_summary  # Socket summary
              - core           # Per CPU core usage
              - diskio         # Disk IO
              - fsstat         # File system summary metrics
              - socket         # Sockets and connection info (linux only)
            enabled: true
            period: 10s
            processes: ['.*']

            # Configure the metric types that are included by these metricsets.
            cpu.metrics: ["percentages", "normalized_percentages"]  # The other available option is ticks.
            core.metrics: ["percentages"]  # The other available option is ticks.
          - module: docker
            metricsets:
              - "container"
              - "cpu"
              - "diskio"
              - "event"
              - "healthcheck"
              - "info"
              - "memory"
              - "network"
              # - "network_summary"
            hosts: ["unix:///var/run/docker.sock"]
            period: 10s
            enabled: true
    output_conf:
      elasticsearch:
        hosts: >-
          {{
            query('inventory_hostnames', 'logs_nodes') |
            map('extract', hostvars, ['private_ip']) |
            map('string') |
            product([':9200']) |
            map('join') |
            list
          }}
        username: "{{ elastic_username }}"
        password: "{{ elastic_password }}"
  when: metricbeat_enabled
