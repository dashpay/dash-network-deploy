name: Manual Deployment

on:
  workflow_dispatch:
    inputs:
      network_type:
        description: "Network type (e.g., devnet, testnet, regtest)"
        required: true
        type: string
      network_name:
        description: "Network to deploy (e.g., devnet-cobblet, testnet)"
        required: true
        type: string
      deploy_tag:
        description: "Ansible tag to run (e.g., full_deploy, platform_update)"
        required: true
        type: string

jobs:
  deploy:
    name: Deploy Dash Network
    runs-on: ubuntu-22.04

    env:
      ANSIBLE_HOST_KEY_CHECKING: "false"

    steps:
      - name: Checkout dash-network-deploy
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-netaddr sshpass jq gnupg

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible-core==2.16.3 jmespath

      - name: Install Ansible roles
        run: |
          ansible-galaxy install -r ansible/requirements.yml
          mkdir -p ~/.ansible/roles
          cp -r ansible/roles/* ~/.ansible/roles/

      - name: Set up GitHub SSH key
        env:
          EVO_APP_DEPLOY_KEY: ${{ secrets.EVO_APP_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EVO_APP_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          cat > ~/.ssh/config << 'EOL'
          Host github.com
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
          EOL

          chmod 600 ~/.ssh/config

      - name: Clone network configs
        run: |
          rm -rf networks
          git clone git@github.com:dashpay/dash-network-configs.git networks

      - name: Check network config
        env:
          NETWORK: ${{ github.event.inputs.network_name }}
        run: |
          if [[ ! -f "networks/$NETWORK.yml" ]]; then
            echo "Error: Network config networks/$NETWORK.yml not found"
            exit 1
          fi

          if [[ "$NETWORK" == devnet-* && ! -f "networks/$NETWORK.ssh.asc" ]]; then
            echo "Error: Encrypted devnet SSH key networks/$NETWORK.ssh.asc not found"
            exit 1
          fi

      - name: Prepare server SSH key
        env:
          NETWORK: ${{ github.event.inputs.network_name }}
          DEPLOY_SERVER_KEY: ${{ secrets.DEPLOY_SERVER_KEY }}
          DEVNET_CI_GPG_PRIVATE_KEY: ${{ secrets.DEVNET_CI_GPG_PRIVATE_KEY }}
          DEVNET_CI_GPG_PASSPHRASE: ${{ secrets.DEVNET_CI_GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME" ~/.ssh
          chmod 700 "$GNUPGHOME" ~/.ssh

          if [[ "$NETWORK" == devnet-* ]]; then
            printf '%s' "$DEVNET_CI_GPG_PRIVATE_KEY" > "$RUNNER_TEMP/devnet-ci-private.asc"
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$DEVNET_CI_GPG_PASSPHRASE" \
              --import "$RUNNER_TEMP/devnet-ci-private.asc"
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$DEVNET_CI_GPG_PASSPHRASE" \
              --decrypt --output "$HOME/.ssh/id_rsa" "networks/$NETWORK.ssh.asc"
          else
            printf '%s\n' "$DEPLOY_SERVER_KEY" > "$HOME/.ssh/id_rsa"
          fi

          chmod 600 "$HOME/.ssh/id_rsa"
          ssh-keygen -y -f "$HOME/.ssh/id_rsa" > "$HOME/.ssh/id_rsa.pub"
          chmod 644 "$HOME/.ssh/id_rsa.pub"

          cat > ~/.ssh/config << 'EOL'
          Host github.com
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no

          Host *
            IdentityFile ~/.ssh/id_rsa
            User ubuntu
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
          EOL

          chmod 600 ~/.ssh/config

      - name: Create networks/.env
        run: |
          cat > networks/.env << EOF2
          PRIVATE_KEY_PATH=$HOME/.ssh/id_rsa
          PUBLIC_KEY_PATH=$HOME/.ssh/id_rsa.pub
          EOF2

      - name: Run Deploy Script
        env:
          NETWORK: ${{ github.event.inputs.network_name }}
          NETWORK_PATH: networks/${{ github.event.inputs.network_name }}.yml
        run: |
          chmod +x ./bin/github-deploy
          ./bin/github-deploy -p "$NETWORK" --tags "${{ github.event.inputs.deploy_tag }}"
